<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impacts &amp; Data | SDG 14</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <meta name="author" content="John">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js"></script>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="index.html">SDG 14</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="impacts.html">Impacts &amp; Data</a></li>
          <li class="nav-item"><a class="nav-link" href="solutions.html">Solutions</a></li>
          <li class="nav-item"><a class="nav-link" href="pledge.html">Pledge</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- PAGE TITLE -->
  <header class="page-title">
    <h1>Impacts &amp; Data</h1>
    <p>How our oceans are being harmed</p>
  </header>


  <!-- STATISTICS -->
  <section class="container section">
    <div class="row g-4">
      <div class="col-md-4">
        <div class="topic-card">Plastic Pollution Stats</div>
        <div class="chart-container">
          <canvas id="plasticChart"></canvas>
        </div>
      </div>

      <div class="col-md-4">
        <div class="topic-card">Coral Bleaching Stats</div>
        <div class="chart-container">
          <canvas id="coralChart"></canvas>
        </div>
      </div>

      <div class="col-md-4">
        <div class="topic-card">Fish Population Stats</div>
        <div class="chart-container">
          <canvas id="fishChart"></canvas>
        </div>
      </div>
    </div>
  </section>

  <!-- INTERACTIVE DATA CHART -->
  <section class="container section">
    <div class="box">Sources of Ocean Pollution</div>
    <div class="chart-container pie-chart">
      <canvas id="myChart"></canvas>
    </div>
  </section>

  <!-- LINE CHARTS -->
  <script>
    // PLASTIC
    new Chart("plasticChart", {
      type: "line",
      data: {
        labels: ["2019", "2030", "2060"],
        datasets: [{
          label: "Plastic pollution (million tonnes)",
          data: [6.1, 7.2, 11.7],
          borderColor: "#0077b6",
          backgroundColor: "rgba(0,119,182,0.1)",
          fill: true,
          lineTension: 0.3
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        legend: { display: true, position: "bottom" },
        title: { display: true, text: "Plastic Pollution" },
        scales: {
          yAxes: [{
            ticks: { beginAtZero: true }
          }]
        }
      }
    });

    // CORAL
    new Chart("coralChart", {
      type: "line",
      data: {
        labels: ["1998", "2010", "2017", "2025"],
        datasets: [{
          label: "Coral bleaching (%)",
          data: [19.8, 31.1, 68.2, 84.4],
          borderColor: "#ff7b54",
          backgroundColor: "rgba(255,123,84,0.1)",
          fill: true,
          lineTension: 0.3
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        legend: { display: true, position: "bottom" },
        title: { display: true, text: "Coral Bleaching" },
        scales: {
          yAxes: [{
            ticks: { beginAtZero: true }
          }]
        }
      }
    });

    // FISH
    new Chart("fishChart", {
      type: "line",
      data: {
        labels: ["1974", "2017", "2019", "2021"],
        datasets: [{
          label: "Sustainable fish stocks",
          data: [90, 65.8, 64.6, 62.3],
          borderColor: "#009688",
          backgroundColor: "rgba(0,150,136,0.1)",
          fill: true,
          lineTension: 0.3
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        legend: { display: true, position: "bottom" },
        title: { display: true, text: "Fish Population" },
        scales: {
          yAxes: [{
            ticks: { beginAtZero: true }
          }]
        }
      }
    });

    // PIE CHART
    var xValues = [
      "Plastic Pollution %",
      "Oil Pollution %",
      "Chemical Waste %",
      "Other Waste %"
    ];

    var yValues = [35, 12, 45, 8];

    var barColors = [
      "#0077b6",
      "#00b4d8",
      "#90e0ef",
      "#03045e"
    ];

    new Chart("myChart", {
      type: "pie",
      data: {
        labels: xValues,
        datasets: [{
          backgroundColor: barColors,
          data: yValues
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        legend: {
          display: true,
          position: "bottom"
        }
      }
    });
  </script>
</section>

  <!-- FOOTER -->
  <footer>
    <p>Page author: rmcg</p>
    <p>SDG 14: Life Below Water · Group R</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
